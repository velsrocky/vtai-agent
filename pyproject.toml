[project]
name = "vtai-agent"
version = "0.6.6"
description = "VT-AIAgent — system-automation agent exposed as an MCP server for opencode/claude/pi"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VT-AIAgent Contributors" }]
keywords = [
    "mcp", "mcp-server", "claude", "opencode", "agent", "guardrails",
    "audit", "automation", "sandbox", "llm-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
urls = { repository = "https://github.com/velsrocky/vtai-agent", issues = "https://github.com/velsrocky/vtai-agent/issues", changelog = "https://github.com/velsrocky/vtai-agent/blob/main/CHANGELOG.md" }
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.45.0",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.42",
]

[project.scripts]
vtai = "vtai_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: live end-to-end checks against a real model (opt in with VTAI_E2E=1)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["uv_build>=0.12.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# The lockfile is revision 5 (uv >= 0.13 writes it; older uv refuses to read
# it). Declaring the floor here makes uv fail with a clear message instead of
# a lockfile-parse error, and setup-uv reads it to pick the CI uv version.
required-version = ">=0.13.1"
