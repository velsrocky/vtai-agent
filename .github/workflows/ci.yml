name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      # A fresh Windows runner does not put Git for Windows' coreutils on
      # PATH (only git.exe and mingw64), but the allowlist-driven sandbox
      # and the suite assume cat/cp/mkdir/grep/tar resolve somewhere trusted.
      # Any Git Bash install has them under usr\bin; prepending here mirrors
      # that documented install so Windows CI tests the real sandbox paths.
      - name: Add Git Bash coreutils to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\Program Files\Git\usr\bin"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      # The Python floor (requires-python >=3.12) is enforced live, not
      # measured once at release time: 0.6.7 shipped with >=3.14 inherited
      # from the authoring machine and CI never noticed — it only ever ran
      # one Python. The matrix pins exactly the supported range.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest tests/ -v
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check src/ tests/

  build-docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker
        run: docker build -t vtai-agent .

      - name: Smoke test the image
        run: |
          # The image's CMD is the stdio MCP server; the CLI is the cheapest
          # proof that the environment, the config and the entrypoint work.
          docker run --rm vtai-agent uv run vtai --help
          docker run --rm vtai-agent uv run vtai tools
          # `doctor` exits non-zero when the model endpoint is unreachable,
          # which is expected in a bare container — assert the parts that
          # must work: the config loads and the writable roots are there.
          docker run --rm vtai-agent uv run vtai doctor 2>&1 | tee /tmp/doctor.txt || true
          grep -q "config valid" /tmp/doctor.txt
          grep -q "writable roots" /tmp/doctor.txt
          # The stdio server must answer an MCP initialize (informational:
          # timing on a cold container is not a reliable gate).
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | docker run -i --rm vtai-agent || true

  release:
    runs-on: ubuntu-latest
    needs: [test, build-docker]
    permissions:
      contents: write
      pull-requests: read
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
