name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      # A fresh Windows runner does not put Git for Windows' coreutils on
      # PATH (only git.exe and mingw64), but the allowlist-driven sandbox
      # and the suite assume cat/cp/mkdir/grep/tar resolve somewhere trusted.
      # Any Git Bash install has them under usr\bin; prepending here mirrors
      # that documented install so Windows CI tests the real sandbox paths.
      - name: Add Git Bash coreutils to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\Program Files\Git\usr\bin"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Setup Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Lint
        run: uv run ruff check src/ tests/

  build-docker:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker
        run: docker build -t vtai-agent .

  release:
    runs-on: ubuntu-latest
    needs: [test, build-docker]
    permissions:
      contents: write
      pull-requests: read
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
