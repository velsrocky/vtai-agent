name: Publish to PyPI

# Release pipeline: tag v* -> build wheel+sdist from the tested tree ->
# publish via PyPI Trusted Publishing (OIDC, no tokens in the repo) with
# build attestations attached. One-time setup: PyPI project "vtai-agent" ->
# "Publishing" -> add Trusted Publisher for this repo + workflow filename.
# workflow_dispatch exists as the registry OIDC rehearsal lever: silently
# skips the PyPI publish and only exercises the registry listing job
# against whatever server.json currently carries.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build distributions
        run: uv build

      - name: Metadata consistency (pyproject == server.json == README pin)
        run: |
          python3 - <<'EOF'
          import json, pathlib, re, sys, tomllib
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          sj = json.load(open("server.json"))
          readme = pathlib.Path("README.md").read_text()
          assert sj["name"] == "io.github.velsrocky/vtai-agent"
          assert sj["version"] == ver, f"server.json {sj['version']} != {ver}"
          assert sj["packages"][0]["version"] == ver, "package version mismatch"
          assert sj["packages"][0]["identifier"] == "vtai-agent"
          assert re.search(r"@v" + re.escape(ver), readme), \
              f"README install pin not at v{ver}"
          assert "io.github.velsrocky/vtai-agent" in readme, "mcp-name proof missing"
          print("metadata in sync at", ver)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    # PyPI publish is a tag-pipeline action only; dispatch runs skip it so
    # a rehearsal can never re-upload existing files (PyPI versions are
    # immutable and a duplicate publish fails the run noisily).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi
    permissions:
      # PyPI Trusted Publishing: id-token proves the build ran from this
      # workflow/tag; attestations attach the provenance to the artifacts.
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  # Lists the server in the official MCP registry (io.github.velsrocky/
  # vtai-agent) so one tag ships everywhere. Auth is GitHub Actions OIDC —
  # the same trust-free pattern as the PyPI publish above; no stored token,
  # so there is nothing to expire mid-release (observed: manually issued
  # registry JWTs expired between releases).
  publish-registry:
    runs-on: ubuntu-latest
    needs: [build, publish]
    # On a tag: list only after PyPI actually published (the registry
    # should only offer artifacts a resolver can fetch). On dispatch:
    # fire alone — the OIDC rehearsal; PyPI's job is skipped.
    # !cancelled() is load-bearing: an upstream SKIP cascades to dependents
    # before their `if` is evaluated unless always()/!cancelled() forces
    # evaluation (first rehearsal fired and silently skipped on exactly
    # this rule).
    if: ${{ !cancelled() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install mcp-publisher 1.8.1 (checksum pinned)
        run: |
          curl -fsSL -o mcp-publisher_linux_amd64.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz" | sha256sum --check -
          tar -xzf mcp-publisher_linux_amd64.tar.gz

      - name: Authenticate with the registry via GitHub OIDC
        run: |
          ./mcp-publisher login github-oidc
          echo "OIDC-authenticated to the registry (proof the workflow's
          id-token is accepted for the io.github.velsrocky namespace)."

      # server.json's version is bumped on main before tagging (house
      # process), so the checkout at the tag carries the matching version.
      - name: Publish server.json to the registry
        run: |
          # A duplicate version is the registry's immutable-history rule
          # (same policy as PyPI). On a rehearsal of an already-listed
          # version, that refusal IS the auth verdict: a request this far
          # into the registry API passed OIDC authorization. The match is
          # narrow — the registry's own message — never a blanket || true.
          # set +e brackets the capture: with bash -e, a failing command
          # substitution aborts before our case can classify the failure
          # (observed in rehearsal 39783619104: silent exit 1, no output).
          set +e
          OUT=$(./mcp-publisher publish server.json 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then exit 0; fi
          case "$OUT" in
            *"cannot publish duplicate version"*)
              echo "AUTH+SCHEMA PROVEN: version already listed; the registry's
                    immutable-history refusal passed the OIDC path through."
              exit 0 ;;
            *) exit 1 ;;
          esac
